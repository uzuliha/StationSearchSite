                id="initial"
                maxlength="1"
                placeholder="例：あ"
                inputmode="hiragana"

            <h2>都道府県</h2>

            <div id="prefecture-list"></div>
        </section>

        <button id="search-button">
            検索

        <section>
            <h2>検索結果</h2>

            <ul id="result"></ul>
        </section>

    </main>

    <script src="js/prefecture.js"></script>
    <script src="js/stationSearch.js"></script>
    <script src="js/main.js"></script>

    <footer>
        <p>
            駅データ：
            <a href="https://github.com/Seo-4d696b75/station_database"
